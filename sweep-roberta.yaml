program: main.py
name: sweepdemo
method: bayes
metric:
  goal: minimize
  name: test/rmse
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001
  hidden_size:
    values: [32, 64, 128, 256]
  intermediate_size:
    values: [128, 256, 512, 1024]
  attention_head_size:
    values: [16, 32, 64]
  num_hidden_layers:
    values: [1, 2, 3, 4]
  num_attention_heads:
    values: [2, 4, 8]
  attention_mode:
    values: [1, 3]
  attention_act_fn:
    values: [1, 2]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--overwrite_output_dir"
  - "--do_train"
  - "--do_eval"
  - "--do_predict"
  - "--model_name_or_path"
  - None
  - "--config_name"
  - roberta-tune.json
  - "--data_path"
  - /home/wuyou/tabred/data/sberbank-housing/
  - "--column_info_path"
  - datasets/income/column_info.json
  - "--output_dir"
  - outputs/sweep/
  - "--num_train_epochs"
  - 1000
  - "--save_total_limit"
  - 1
  - "--save_strategy"
  - epoch
  - "--evaluation_strategy"
  - epoch
  - "--load_best_model_at_end"
  - True
  - "--task"
  - regression
  - "--categorical_encode_type"
  - label
  - "--per_device_train_batch_size"
  - 256
  - "--per_device_eval_batch_size"
  - 256
  - "--gradient_accumulation_steps"
  - 1
  - ${args}