program: main.py
name: sweepdemo
method: bayes
metric:
  goal: minimize
  name: test/rmse
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001
  dim_z:
    values: [32, 64, 128, 256]
  dim_g:
    values: [128, 256, 512, 1024]
  ternary_rank:
    values: [16, 32, 64]
  num_iterations:
    values: [1, 2, 3, 4]
  num_channels:
    values: [2, 4, 8]
  attention_mode:
    value: 1
  attention_act_fn:
    value: 2
  alpha:
    distribution: uniform
    min: 0.05
    max: 0.5
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--create_folds"
  - "--do_train"
  - "--do_eval"
  - "--do_predict"
  - "--model_name_or_path"
  - None
  - "--config_name"
  - roberta-tune.json
  - "--data_path"
  - datasets/income/income.csv
  - "--column_info_path"
  - datasets/income/column_info.json
  - "--output_dir"
  - outputs/sweep/
  - "--num_train_epochs"
  - 1000
  - "--save_total_limit"
  - 1
  - "--save_strategy"
  - epoch
  - "--evaluation_strategy"
  - epoch
  - "--load_best_model_at_end"
  - True
  - "--task"
  - imputation
  - "--categorical_encode_type"
  - label
  - "--per_device_train_batch_size"
  - 256
  - "--per_device_eval_batch_size"
  - 256
  - "--gradient_accumulation_steps"
  - 1
  - "--mask_ratio"
  - 0.1
  - ${args}