program: main.py
name: sweepdemo
method: bayes
metric:
  goal: minimize
  name: eval/rmse
parameters:
  learning_rate:
    min: 0.0001
    max: 0.1
  hidden_size:
    values: [16, 32, 64]
  intermediate_size:
    values: [64, 128, 256]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--overwrite_output_dir"
  - "--create_folds"
  - "--do_train"
  - "--do_eval"
  - "--model_name_or_path"
  - None
  - "--config_name"
  - roberta-tune.json
  - "--data_path"
  - /home/wuyou/tabred/data/weather
  - "--column_info_path"
  - datasets/income/column_info.json
  - "--output_dir"
  - outputs/weather/tmp
  - "--num_train_epochs"
  - 1
  - "--save_total_limit"
  - 1
  - "--save_strategy"
  - steps
  - "--save_steps"
  - 500
  - "--evaluation_strategy"
  - steps
  - "--eval_steps"
  - 500
  - "--task"
  - regression
  - "--categorical_encode_type"
  - label
  - "--per_device_train_batch_size"
  - 1024
  - "--per_device_eval_batch_size"
  - 1024
  - "--gradient_accumulation_steps"
  - 1
  - "--lr_scheduler_type"
  - cosine
  - "--warmup_ratio"
  - 0.015
  - ${args}